appId: com.claimguardai.desktop
productName: ClaimGuard AI
copyright: Copyright © 2026 ClaimGuard AI

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - package.json

extraResources:
  - from: ../backend/target/claimguardai-backend.jar
    to: backend.jar

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ClaimGuard AI

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.business

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Office
