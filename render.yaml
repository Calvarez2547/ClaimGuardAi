services:
  - type: web
    name: claimguardai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: claimguardai-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: claimguardai-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: claimguardai-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: AI_ENABLED
        value: "false"
      - key: AI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: REFRESH_TOKEN_EXPIRY_SECONDS
        value: "604800"

databases:
  - name: claimguardai-db
    databaseName: claimguardai
    plan: free
