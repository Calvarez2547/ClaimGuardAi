spring:
  config:
    activate:
      on-profile: desktop
  datasource:
    url: ${CLAIMGUARDAI_DESKTOP_DB_URL:jdbc:h2:file:~/.claimguardai/data;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

app:
  runtime-environment: desktop
  auth:
    seed:
      enabled: true
      username: admin
      email: admin@claimguardai.local
      password: Admin123!
      account-enabled: true
      roles:
        - ADMINISTRATOR
  jwt:
    secret: ${JWT_SECRET:desktop-jwt-secret-please-change-me-in-production-use}
  security:
    cors:
      allowed-origins: "http://localhost:${SERVER_PORT:8080}"
    rate-limiting:
      enabled: true

logging:
  level:
    root: WARN
    com.claimguardai: INFO
