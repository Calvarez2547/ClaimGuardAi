server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: claimguardai
  profiles:
    default: local
  datasource:
    url: ${CLAIMGUARDAI_DB_URL:jdbc:postgresql://localhost:5432/claimguardai}
    username: ${CLAIMGUARDAI_DB_USERNAME:}
    password: ${CLAIMGUARDAI_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  name: ClaimGuard AI Backend
  version: 0.2.0
  runtime-environment: ${CLAIMGUARDAI_RUNTIME_ENV:default}
  ai:
    api-key: ${AI_API_KEY:}
  jwt:
    secret: ${JWT_SECRET:}
  security:
    cors:
      allowed-origins: ${CLAIMGUARDAI_CORS_ALLOWED_ORIGINS:http://localhost:5173}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${CLAIMGUARDAI_LOCAL_DB_URL:jdbc:h2:mem:claimguardai;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${CLAIMGUARDAI_LOCAL_DB_USERNAME:sa}
    password: ${CLAIMGUARDAI_LOCAL_DB_PASSWORD:}
    driver-class-name: ${CLAIMGUARDAI_LOCAL_DB_DRIVER:org.h2.Driver}
  jpa:
    database-platform: ${CLAIMGUARDAI_LOCAL_JPA_PLATFORM:org.hibernate.dialect.H2Dialect}

app:
  runtime-environment: local

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${CLAIMGUARDAI_TEST_DB_URL:jdbc:h2:mem:claimguardai-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${CLAIMGUARDAI_TEST_DB_USERNAME:sa}
    password: ${CLAIMGUARDAI_TEST_DB_PASSWORD:}
    driver-class-name: ${CLAIMGUARDAI_TEST_DB_DRIVER:org.h2.Driver}
  jpa:
    database-platform: ${CLAIMGUARDAI_TEST_JPA_PLATFORM:org.hibernate.dialect.H2Dialect}

app:
  runtime-environment: test
